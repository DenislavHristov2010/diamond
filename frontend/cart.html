<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <nav id="nav">
    </nav>
    <h1>🛒 Your Cart</h1>

    <div id="cartContainer">
        <table id="cartTable" class="cartTable">
            <thead>
                <tr>
                    <th>Service Name</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total Price</th>
                    <th class="actions-button">Actions</th>
                </tr>
            </thead>
            <tbody id="cartTableBody">
                <!-- Rows will be added here -->
            </tbody>
        </table>
    </div>

    <div class="cart-summary">
        <button id="checkoutBtn" class="checkoutBtn">Checkout</button>
    </div>


    <script src="/static/script.js"></script>
</body>

</html>
